<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK_time · 문의</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0F13; --surface:#171921; --line:#2A2E3E;
  --ink:#F2F3F7; --muted:#8B90A3; --accent:#FF4D5E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Noto Sans KR',sans-serif;margin:0;}
html,body{background:var(--bg);color:var(--ink);}
body{display:flex;justify-content:center;min-height:100vh;}
#page{width:100%;max-width:640px;padding:0 0 60px;}
header{position:sticky;top:0;z-index:10;background:rgba(14,15,19,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-weight:900;font-size:17px;letter-spacing:-.02em;}
.logo b{color:var(--accent);} .logo span{color:var(--muted);font-weight:700;}
nav a{color:var(--muted);text-decoration:none;font-size:13px;margin-left:16px;font-weight:500;}
nav a.cta{color:#fff;background:var(--accent);padding:8px 14px;border-radius:9px;font-weight:700;}
main{padding:40px 24px;text-align:center;}
h1{font-size:26px;font-weight:900;margin-bottom:14px;letter-spacing:-.02em;}
p{color:var(--muted);font-size:14.5px;line-height:1.85;margin-bottom:24px;max-width:440px;margin-left:auto;margin-right:auto;}
.mailcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 24px;margin:0 auto 20px;max-width:440px;}
.mailcard a{display:inline-block;color:#fff;background:var(--accent);font-weight:700;font-size:15px;
  padding:14px 28px;border-radius:11px;text-decoration:none;}
.note{font-size:12.5px;color:var(--muted);opacity:.8;}
footer{padding:28px 24px;text-align:center;border-top:1px solid var(--line);margin-top:20px;}
footer .flinks{display:flex;justify-content:center;gap:18px;margin-bottom:14px;flex-wrap:wrap;}
footer a{color:var(--muted);text-decoration:none;font-size:13px;}
footer .copy{color:var(--muted);font-size:11.5px;opacity:.7;}
</style>
</head>
<body>
<div id="page">
<header>
  <div class="logo"><b>HSK</b><span>_time</span></div>
  <nav><a class="cta" href="index.html">학습 시작</a></nav>
</header>
<main>
  <h1>문의하기</h1>
  <p>앱 이용 중 궁금한 점이나 오류, 제휴·협업 문의는 아래 이메일로 편하게 연락해주세요. 보통 1~2일 내에 답변드려요.</p>
  <div class="mailcard">
    <a href="mailto:hsktime.contact@gmail.com">hsktime.contact@gmail.com</a>
    <p class="note" style="margin-top:16px;margin-bottom:0;">버튼을 누르면 기본 메일 앱이 열려요</p>
  </div>
</main>
<footer>
  <div class="flinks">
    <a href="index.html">학습 앱</a>
    <a href="guide.html">HSK 가이드</a>
    <a href="about.html">소개</a>
    <a href="privacy.html">개인정보처리방침</a>
  </div>
  <div class="copy">© 2026 HSK_time. All rights reserved.</div>
</footer>
</div>
</body>
</html>
